services:
  - type: web
    name: forge-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: .
    dockerfilePath: ./docker/Dockerfile.api
    dockerContext: .
    dockerCommand: /bin/sh /app/docker/start-api.sh
    healthCheckPath: /health
  
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: SANDBOX_IMAGES
        value: '["python:3.12-slim", "node:20-slim"]'
