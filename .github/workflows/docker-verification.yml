name: Docker Verification

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - "apps/**"
      - "packages/**"
      - "services/**"
      - "tests/**"
      - ".github/workflows/docker-verification.yml"
  pull_request:
    branches: [main]
    paths:
      - "docker/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - "apps/**"
      - "packages/**"
      - "services/**"
      - "tests/**"
      - ".github/workflows/docker-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containers:
    name: Build and verify containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build application images
        run: |
          docker build -f docker/Dockerfile.api -t forge-api:ci .
          docker build -f docker/Dockerfile.worker -t forge-worker:ci .
          docker build -f docker/Dockerfile.frontend -t forge-frontend:ci .
      - name: Build sandbox images
        run: |
          docker build -f docker/Dockerfile.sandbox-python -t forge-sandbox-python:ci .
          docker build -f docker/Dockerfile.sandbox-node -t forge-sandbox-node:ci .
      - name: Verify sandbox runtime users
        run: |
          test "$(docker run --rm forge-sandbox-python:ci id -u)" != "0"
          test "$(docker run --rm forge-sandbox-node:ci id -u)" != "0"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - name: Install locked backend dependencies
        run: uv sync --frozen --all-extras
      - name: Run Docker integration and security tests
        env:
          PYTHONPATH: .
          ENVIRONMENT: test
        run: >-
          uv run pytest -v
          tests/integration/test_docker_sandbox.py
          tests/security/test_docker_sandbox_security.py
          tests/e2e/test_docker_execution_workflow.py
